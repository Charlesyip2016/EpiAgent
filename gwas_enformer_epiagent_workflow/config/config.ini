# GWAS-Enformer-EpiAgent Workflow Configuration
# This file contains the main configuration parameters for the integrative analysis workflow

[project]
name = "gwas_enformer_epiagent_workflow"
version = "1.0.0"
description = "Integrative analysis workflow for functionally validating disease-associated SNPs"

[disease]
# EXAMPLE: Update these parameters for your specific disease of interest
name = "Alzheimer's disease"
gwas_catalog_id = "GCST90027158"  # Example: Replace with actual GWAS study ID
target_tissue = "prefrontal cortex"
target_cell_types = ["microglia", "astrocytes", "neurons"]

[gwas]
# GWAS analysis parameters
ld_threshold = 0.8  # r² threshold for linkage disequilibrium
reference_panel = "1000GP_Phase3"
p_value_threshold = 5e-8  # Genome-wide significance threshold

[enformer]
# Enformer model parameters
model_url = "https://tfhub.dev/deepmind/enformer/1"
sequence_length = 196608  # Base pairs (Enformer input requirement)
prediction_tracks = ["CAGE", "DNase", "ATAC-seq", "H3K27ac"]
cell_lines_of_interest = ["K562", "GM12878", "HepG2"]  # Update based on disease relevance

[epiagent]
# EpiAgent model parameters
model_path = "./model/pretrained_EpiAgent.pth"  # Update path to pretrained model
ccre_reference_file = "./data/ccre_coordinates_hg38.bed"  # cCRE reference coordinates
max_sequence_length = 8192
vocab_size = 1355449
num_layers = 18
embedding_dim = 512
num_attention_heads = 8

[data]
# Data directories and file paths
reference_genome = "./data/raw/hg38.fa"
output_dir = "./data/results"
scatac_dataset_id = "GSE12345"  # Example: Update with actual dataset ID
processed_data_dir = "./data/processed"

[analysis]
# Analysis parameters
n_top_snps = 10  # Number of top SNPs to analyze
effect_size_threshold = 0.1  # Minimum effect size for functional prediction
cell_type_specificity_threshold = 0.5  # Threshold for cell-type specific activity